name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Production release
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tag must be a version prefixed with v (for example, v1.0.0)." >&2
            exit 2
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Apple signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build Battery Watch
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh battery-watch --notarize

      - name: Build Input Guard
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh input-guard --notarize

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            target/release/bundle/battery-watch/dmg/Battery-Watch.dmg \
            target/release/bundle/input-guard/dmg/Input-Guard.dmg \
            "${args[@]}"
