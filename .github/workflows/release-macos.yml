name: Release macOS

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set release version
        id: version
        env:
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: |
          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          version="${latest_tag#v}"
          version="${version:-0.0.0}"
          IFS=. read -r major minor patch <<< "$version"

          case "$VERSION_INCREMENT" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "app-version=$version" >> "$GITHUB_OUTPUT"
          echo "release-tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} DMG
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: battery-watch
            name: Battery Watch
            dmg: Battery-Watch.dmg
          - app: input-guard
            name: Input Guard
            dmg: Input-Guard.dmg
          - app: cmd-tab
            name: Cmd Tab
            dmg: Cmd-Tab.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Apple signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build ${{ matrix.name }}
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app-version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh "${{ matrix.app }}" --notarize

      - name: Generate ${{ matrix.name }} appcast
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          zsh scripts/create-appcast.sh "${{ matrix.app }}" "$RELEASE_TAG" "$key_file"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.app }}
          path: |
            target/release/bundle/${{ matrix.app }}/dmg/${{ matrix.dmg }}
            target/release/bundle/${{ matrix.app }}/dmg/*.xml
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/Battery-Watch.dmg \
            release-assets/Battery-Watch.xml \
            release-assets/Input-Guard.dmg \
            release-assets/Input-Guard.xml \
            release-assets/Cmd-Tab.dmg \
            release-assets/Cmd-Tab.xml \
            "${args[@]}"
