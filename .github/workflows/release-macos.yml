name: Release macOS

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    name: Production release
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set release version
        env:
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: |
          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          version="${latest_tag#v}"
          version="${version:-0.0.0}"
          IFS=. read -r major minor patch <<< "$version"

          case "$VERSION_INCREMENT" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Set up Apple signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build Battery Watch
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh battery-watch --notarize

      - name: Build Input Guard
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh input-guard --notarize

      - name: Build Cmd Tab
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh cmd-tab --notarize

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            target/release/bundle/battery-watch/dmg/Battery-Watch.dmg \
            target/release/bundle/input-guard/dmg/Input-Guard.dmg \
            target/release/bundle/cmd-tab/dmg/Cmd-Tab.dmg \
            "${args[@]}"
